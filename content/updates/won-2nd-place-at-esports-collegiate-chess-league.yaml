title: 'Won 2nd Place at Esports Collegiate Chess League '
date: 2026-11-22
category: milestone
detail: >-
  Excited to say we got 2nd place at CCL in our division! As my last year
  representing TAMUSA, I am thankful to have been able to play chess and meet
  lots of people during this experience.


  I'm rusty but I was able to pull my weight and managed to get that spark of
  motivation to continue learning chess after such a long time being away from a
  board. 
